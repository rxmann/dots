[audio]
enable_sounds = true

[bar.default]
center = [ "control-center", "clock" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "settings",
    "session"
]
font_family = "Adwaita Sans"
font_weight = 400
margin_ends = 5
padding = 24
show_on_workspace_switch = false
start = [ "wallpaper", "workspaces" ]
widget_spacing = 32

[brightness]
enable_ddcutil = true

[control_center]
hidden_tabs = [ "bluetooth", "weather", "screen-time" ]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = false

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 106.87109375
    box_width = 290.94921875
    cx = 1716.998046875
    cy = 984.064453125
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1730.7265625
    cy = 837.70703125
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "volume"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"

[osd]
scale = 2.0000000223517418

    [osd.kinds]
    media = false

[plugins]
auto_update = "none"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
button_borders = false
clipboard_confirm_clear_history = false
input_borders = false
lang = "en"
polkit_agent = true
popup_borders = false
telemetry_enabled = true

    [shell.animation]
    speed = 1.2000000178813934

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    clipboard_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    shadow = false
    transparency_mode = "glass"

[system.monitor]
enabled = false

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
shell_mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/rxman/Pictures/Wallpapers/wp7326045-assassins-creed-4k-wallpapers.jpg"

    [wallpaper.last]
    path = "/home/rxman/Pictures/Wallpapers/wp7326045-assassins-creed-4k-wallpapers.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/rxman/Pictures/Wallpapers/wp7326045-assassins-creed-4k-wallpapers.jpg"

[weather]
enabled = false

[widget.bluetooth]
enabled = false

[widget.clock]
format = "{:%I:%M %p %A}"

[widget.control-center]
glyph = "home"
scale = 1.2000000000000002

[widget.media]
enabled = false

[widget.workspaces]
active_pill_size = 2.0
inactive_pill_size = 2.0
