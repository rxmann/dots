# Set the leader key to Alt + S
set -g prefix M-s
unbind C-b  # Unbind the default prefix (Ctrl+b)


# Use hjkl to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Faster pane resizing using prefix + Shift + hjkl
bind H resize-pane -L 15
bind J resize-pane -D 15
bind K resize-pane -U 15
bind L resize-pane -R 15

# Enable mouse support (selecting, resizing panes with the mouse)
set -g mouse on
set -g set-clipboard on

# Copy mode keybindings (Wayland)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"

# Enable pane splitting to use the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Terminal & Color Settings
set-option -ga terminal-overrides ',xterm-256color:Tc'
set -g default-terminal "tmux-256color"

# --- Status Bar & Border Colors ---
set -g status-position top
set -g status-style bg='#1e1e2e',fg='#a6adc8'
setw -g window-status-style fg='#6c7086',bg='#1e1e2e'
setw -g window-status-current-style fg='#89b4fa',bg='#181825',bold
set -g pane-border-style fg='#313244'
set -g pane-active-border-style fg='#89b4fa'
set -g message-style bg='#313244',fg='#cdd6f4'

# Reload tmux configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Use vim keybindings for copy-mode
setw -g mode-keys vi
