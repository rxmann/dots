;==========================================================
;   Polybar config - compact, mostly white (i3 / Ubuntu)
;   Alpha colors use #AARRGGBB (polybar has no rgba())
;==========================================================

[colors]
background     = #E60f0f14
background-alt = #26ffffff
foreground     = #ffffff
muted          = #8a8a99
red            = #f87171
border         = #22ffffff

; -- BAR (shared by every monitor) -----------------------------------------

[bar/main]
; MONITOR is set per-bar by launch.sh
monitor      = ${env:MONITOR:}
monitor-strict = false
width        = 100%:-16
height       = 22
offset-x     = 8
offset-y     = 4
radius       = 8
bottom       = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size  = 1
border-color = ${colors.border}

padding-left  = 1
padding-right = 1
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=8:weight=medium;2
font-1 = JetBrainsMono Nerd Font:size=10;2

modules-left   = launcher i3
modules-center = date
modules-right  = cpu memory wlan volume battery powerprofiles notification systray powerbtn

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true
wm-restack    = i3

; Same bar without the tray (a tray can only live on one bar)
[bar/secondary]
inherit      = bar/main
modules-right = cpu memory wlan volume battery powerprofiles notification powerbtn

; -- LEFT ------------------------------------------------------------------

[module/launcher]
type = custom/text
content = 󰣇
content-font = 2
click-left = rofi -show drun

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = #000000
label-urgent-padding = 1

; -- CENTER ----------------------------------------------------------------

[module/date]
type = internal/date
interval = 1
date     = %a %d %b  %I:%M %p
date-alt = %Y-%m-%d  %I:%M:%S %p
label = %date%

; -- RIGHT (all white) -----------------------------------------------------

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
label = %percentage_used:2%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = 󰖩
label-disconnected = 󰖪

[module/volume]
type = custom/script
exec = ~/projects/dots/polybar/scripts/volume.sh
tail = true
click-left   = pavucontrol
click-right  = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-middle = pactl set-sink-volume @DEFAULT_SINK@ 50%
scroll-up    = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down  = pactl set-sink-volume @DEFAULT_SINK@ -5%
label = %output%

[module/battery]
type = custom/script
exec = ~/projects/dots/polybar/scripts/battery.sh
interval = 10
label = %output%

[module/powerprofiles]
type = custom/script
exec = ~/projects/dots/polybar/scripts/power_profiles.sh
interval = 5
click-left = ~/projects/dots/polybar/scripts/power_profiles.sh menu
label = %output%

[module/notification]
type = custom/text
content = 󰂚
click-left   = dunstctl history-pop
click-right  = dunstctl close-all
click-middle = dunstctl set-paused toggle

; needs polybar >= 3.7
[module/systray]
type = internal/tray
format-margin = 2
tray-spacing = 6
tray-size = 55%

[module/powerbtn]
type = custom/text
content = 󰐥
content-foreground = ${colors.red}
click-left = ~/projects/dots/polybar/scripts/power_menu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
